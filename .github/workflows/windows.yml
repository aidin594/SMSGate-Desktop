name: Windows tests and beta build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install requirements
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Test domain logic, persistence and mocked Windows registry
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test GUI offscreen using mocked network, credentials and registry
        run: python tests/gui_smoke.py
      - name: Build isolated community folder
        run: >-
          python -m PyInstaller --clean --noconfirm --onedir --windowed
          --name SMSGateDeskCommunity
          --icon "assets\SMSGateDesk.ico"
          --add-data "assets\SMSGateDesk.ico;assets"
          --add-data "assets\SMSGateDesk.png;assets"
          app.py
      - name: Verify packaged Windows credential self-test
        shell: pwsh
        run: |
          # PowerShell does not reliably wait for a Windows GUI-subsystem EXE
          # invoked via '&': $LASTEXITCODE can be $null even when it starts.
          $exe = Join-Path $PWD 'dist\SMSGateDeskCommunity\SMSGateDeskCommunity.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--credential-self-test' -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Packaged credential self-test timed out after 30 seconds'
          }
          $code = $process.ExitCode
          if ($code -ne 0) {
            Write-Host "Packaged Windows credential self-test failed with exit code $code"
            $logDirectory = Join-Path $env:LOCALAPPDATA 'SMSGateDeskCommunity'
            foreach ($name in @('smsgate.log','fatal-python.log')) {
              $logPath = Join-Path $logDirectory $name
              if (Test-Path $logPath) {
                Write-Host "Last 40 lines of $name (disposable CI test account):"
                Get-Content $logPath -Tail 40
              }
              else { Write-Host "No $name produced" }
            }
            throw 'Packaged credential self-test failed'
          }
      - name: Include licensing and replaceable binary notices
        shell: pwsh
        run: |
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md,DISTRIBUTION_CHECKLIST.md -Destination dist\SMSGateDeskCommunity
          Copy-Item LICENSES -Destination dist\SMSGateDeskCommunity -Recurse
      - name: Upload beta build artifact (NOT a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: SMSGateDeskCommunity-Windows-beta
          path: dist/SMSGateDeskCommunity/
          if-no-files-found: error
          retention-days: 14
