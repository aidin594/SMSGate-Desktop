name: Capture genuine demo UI screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/screenshots-request.md'

permissions:
  contents: write

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Capture Qt UI using mock messages (no SMS or network)
        shell: pwsh
        env:
          SMSGATE_SCREENSHOT_DIR: docs/screenshots
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/gui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'GUI screenshot capture failed' }
          foreach ($file in @('docs/screenshots/conversations.png','docs/screenshots/settings.png')) {
            if (-not (Test-Path $file) -or (Get-Item $file).Length -lt 10000) {
              throw "Screenshot missing or too small: $file"
            }
          }
      - name: Upload QA images for inspection
        uses: actions/upload-artifact@v4
        with:
          name: qt-ui-demo-screenshots
          path: docs/screenshots/*.png
          retention-days: 14
      - name: Commit authentic screenshots to README assets
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/conversations.png docs/screenshots/settings.png
          git commit -m 'Add authentic synthetic-data UI screenshots'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to commit screenshots' }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw 'Unable to rebase screenshots on latest main' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Unable to push screenshots' }
